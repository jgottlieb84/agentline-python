[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentline"
version = "0.3.0"
description = "Phone numbers, SMS, email, and voice for AI agents."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
authors = [{ name = "Agentline", email = "support@agentline.co" }]
keywords = [
    "agents",
    "ai",
    "sms",
    "2fa",
    "voice",
    "email",
    "telephony",
    "llm",
    "anthropic",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Telephony",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = ["httpx>=0.24"]

[project.urls]
Homepage = "https://www.agentline.co"
Documentation = "https://www.agentline.co/docs"
Repository = "https://github.com/jgottlieb84/agentline-python"
Issues = "https://github.com/jgottlieb84/agentline-python/issues"

[tool.hatch.build.targets.wheel]
packages = ["agentline"]

[tool.hatch.build.targets.sdist]
include = ["agentline", "README.md", "LICENSE"]
